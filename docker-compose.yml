services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: univox
      POSTGRES_PASSWORD: univox
      POSTGRES_DB: univox
    ports:
      - "5432:5432"
    volumes:
      - univox_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U univox -d univox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  univox_pg:
}
