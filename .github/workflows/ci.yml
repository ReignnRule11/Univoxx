name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://univox:univox@localhost:5432/univox_test
      AUTH_SECRET: test-auth-secret-must-be-at-least-32-chars
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
      TRUST_PROXY: "false"
      STORAGE_PROVIDER: memory
      PAYMENTS_PROVIDER: sandbox
      PAYMENTS_WEBHOOK_SECRET: test-payments-webhook-secret
      PAYMENTS_PLATFORM_FEE_BPS: "1000"
      LIVE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
